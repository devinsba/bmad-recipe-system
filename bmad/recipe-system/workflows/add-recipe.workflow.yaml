code: add-recipe
name: "Add Recipe"
description: "Guides the user through adding a new recipe, capturing all relevant details, provenance, and archival metadata. Tracks version history and ensures all information is cataloged for future reference."
steps:
  - prompt: "Enter the recipe name:"
  - prompt: "Enter the source (book, website, etc.):"
  - prompt: "List ingredients (one per line):"
  - prompt: "Describe the preparation steps:"
  - prompt: "Tag with filters (cooking method, tool, dietary concerns, provenance):"
  - prompt: "Provide any historical notes, inspiration, or context for this recipe:"
  - prompt: "List related recipes or references (if any):"
  - action: "Save recipe details, including all metadata, to a text file in {project-root}/bmad/recipe-system/data/recipes/"
  - action: "Record initial version and timestamp for version history."
  - action: "Archive all input data for future reference."
  - action: "Confirm recipe entry and commit changes to git."
