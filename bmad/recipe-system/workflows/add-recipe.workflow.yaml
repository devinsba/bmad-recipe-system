code: add-recipe
name: "Add Recipe"
description: "Guides the user through adding a new recipe, capturing all relevant details and storing it in the system."
steps:
  - prompt: "Enter the recipe name:"
  - prompt: "Enter the source (book, website, etc.):"
  - prompt: "List ingredients (one per line):"
  - prompt: "Describe the preparation steps:"
